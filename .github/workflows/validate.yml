name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    name: HACS (public repositories only)
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Home Assistant integration validation
        uses: home-assistant/actions/hassfest@master

  unit-tests:
    name: Protocol and visualization tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v
      - name: Validate LED Studio and LED Player JavaScript syntax
        run: |
          node --check custom_components/govee_led_control/frontend/govee-led-studio.js
          node --check custom_components/govee_led_control/frontend/govee-led-player.js
      - name: Test LED Player gallery playback calls
        run: node tests/test_led_player.mjs
      - name: Test unified LED Studio image/GIF editor
        run: node tests/test_studio_editor.mjs
