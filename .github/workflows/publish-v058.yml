name: Publish v0.5.8

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v058.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create validated v0.5.8 release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish release from validated integration commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.8 \
            --repo "$GITHUB_REPOSITORY" \
            --target "c44360f2d87511a78092be97726efdfd7b74e067" \
            --title "v0.5.8 — Ajout d'appareil H70B3 corrigé" \
            --notes-file "docs/releases/v0.5.8.md"
