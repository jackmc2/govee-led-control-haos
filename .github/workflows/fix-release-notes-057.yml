name: Fix v0.5.7 release notes encoding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-release-notes-057.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correctly encoded notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update existing GitHub Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.5.7 \
            --repo "$GITHUB_REPOSITORY" \
            --title "v0.5.7 — Luminosité mémorisée du Player" \
            --notes-file "docs/releases/v0.5.7.md"
