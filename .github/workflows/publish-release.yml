name: Publish HACS release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-release.yml"
      - "custom_components/govee_led_control/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish version from manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the integration version
        id: version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/govee_led_control/manifest.json", encoding="utf-8"))["version"])')
          test -n "$version"
          test -f "docs/releases/v${version}.md"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Publish tag and GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG — Govee LED Control HAOS" \
            --notes-file "docs/releases/$TAG.md" \
            --latest
