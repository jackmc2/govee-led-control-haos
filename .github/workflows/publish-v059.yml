name: Publish v0.5.9

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v059.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish validated v0.5.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.9 \
            --repo "$GITHUB_REPOSITORY" \
            --target "99b365a4839cfd7f48c127fc82c4d690e1b27da9" \
            --title "v0.5.9 — Galerie LED Player triée de A à Z" \
            --notes-file "docs/releases/v0.5.9.md"
