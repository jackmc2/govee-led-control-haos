name: Publish v0.5.10

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0510.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish validated v0.5.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.5.10 \
            --repo "$GITHUB_REPOSITORY" \
            --target "8d523548e5557d064a9d50af0adb2ee47241b9a6" \
            --title "v0.5.10 — Catégories des images et GIF" \
            --notes-file "docs/releases/v0.5.10.md"
